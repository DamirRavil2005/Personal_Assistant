spring.application.name=personal-assistant

# === DATABASE ===
spring.datasource.url=jdbc:postgresql://localhost:5432/assistant_db
spring.datasource.username=assistant
spring.datasource.password=assistant_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# === Redis ===
spring.data.redis.host=localhost
spring.data.redis.port=6379

# === Server ===
server.port=8080

# === Logging ===
logging.level.org.springframework.security=DEBUG
logging.level.kz.aitu.assistant=DEBUG

# === JWT ===
app.jwt.secret=ZmQ4N2YxYjk4MGFmNmI5N2YxYjk4MGFmNmI5N2YxYjk4MGFmNmI5N2YxYjk4MGFmNmI5N2Y
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# === Swagger / OpenAPI ===
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs